<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd0c9"/>
      <stop offset="1" stop-color="#1565a8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#13293d"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="200" cy="200" r="150"/></clipPath>
  </defs>
  <rect width="1200" height="400" rx="40" fill="url(#bg)"/>
  <!-- the pool -->
  <circle cx="200" cy="200" r="150" fill="url(#water)"/>
  <g clip-path="url(#disc)" fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M40 150 q40 -22 80 0 t80 0 t80 0 t80 0" stroke-width="7" opacity=".55"/>
    <path d="M40 255 q40 -22 80 0 t80 0 t80 0 t80 0" stroke-width="7" opacity=".35"/>
  </g>
  <!-- machines joined into one pool -->
  <g stroke="#ffe08a" stroke-width="6" opacity=".9">
    <line x1="200" y1="200" x2="120" y2="125"/>
    <line x1="200" y1="200" x2="290" y2="135"/>
    <line x1="200" y1="200" x2="135" y2="290"/>
    <line x1="200" y1="200" x2="280" y2="285"/>
  </g>
  <circle cx="200" cy="200" r="34" fill="#ffd166" stroke="#0d1b2a" stroke-width="6"/>
  <g fill="#ffffff" stroke="#0d1b2a" stroke-width="5">
    <rect x="98" y="104" width="44" height="42" rx="9"/>
    <rect x="268" y="114" width="44" height="42" rx="9"/>
    <rect x="113" y="269" width="44" height="42" rx="9"/>
    <rect x="258" y="264" width="44" height="42" rx="9" fill="#ffe8a3" stroke-dasharray="7 6"/>
  </g>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="6"/>
  <!-- wordmark -->
  <text x="410" y="215" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="128" fill="#ffffff">Story<tspan fill="#3fd0c9">Pool</tspan></text>
  <text x="414" y="285" font-family="Asap, Helvetica, Arial, sans-serif" font-size="38" fill="#b9c7d6" letter-spacing="2">Jeff's shared build &amp; AI cluster</text>
</svg>
