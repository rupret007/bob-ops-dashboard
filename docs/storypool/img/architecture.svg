<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" font-family="Asap, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#33475b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f9d8b"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c77d00"/></marker>
    <style>
      .t{font-size:20px;font-weight:700;fill:#0d1b2a}
      .s{font-size:15px;fill:#33475b}
      .m{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:13.5px;fill:#13293d}
      .lbl{font-size:14px;fill:#33475b;font-style:italic}
      .tag{font-size:12px;font-weight:700;fill:#ffffff}
    </style>
  </defs>
  <rect width="1400" height="940" fill="#f7fafc"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0d1b2a">StoryPool architecture</text>
  <text x="40" y="80" class="s">Solid = built today. Dashed = planned / in progress. Generic host names only.</text>

  <!-- Tailnet boundary -->
  <rect x="20" y="100" width="1360" height="820" rx="22" fill="none" stroke="#7a8fa6" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="40" y="88" width="300" height="26" rx="13" fill="#7a8fa6"/>
  <text x="56" y="106" class="tag">TAILNET ONLY · token per node</text>

  <!-- NucBox hub -->
  <rect x="420" y="140" width="560" height="430" rx="18" fill="#ffffff" stroke="#1565a8" stroke-width="3"/>
  <text x="440" y="172" class="t">NucBox (Windows) → WSL Ubuntu: the hub</text>
  <rect x="440" y="186" width="250" height="44" rx="10" fill="#e8f1fb" stroke="#1565a8"/>
  <text x="452" y="206" class="s">Tailscale (userspace mode)</text>
  <text x="452" y="223" class="m">tailnet :4222 → 127.0.0.1</text>
  <line x1="690" y1="208" x2="730" y2="208" stroke="#33475b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="732" y="186" width="230" height="44" rx="10" fill="#e8f1fb" stroke="#1565a8"/>
  <text x="744" y="206" class="s">nats-server v2.15.1</text>
  <text x="744" y="223" class="m">127.0.0.1:4222 only</text>

  <text x="440" y="262" class="s" font-weight="700">JetStream</text>
  <g>
    <rect x="440" y="272" width="250" height="56" rx="10" fill="#eef8f6" stroke="#1f9d8b"/>
    <text x="452" y="294" class="m">JOBS  (workqueue, 24h)</text>
    <text x="452" y="314" class="m">jobs.&lt;class&gt;.&lt;id&gt;</text>
    <rect x="712" y="272" width="250" height="56" rx="10" fill="#eef8f6" stroke="#1f9d8b"/>
    <text x="724" y="294" class="m">RESULTS (limits, 7d)</text>
    <text x="724" y="314" class="m">results.&lt;id&gt;</text>
    <rect x="440" y="338" width="250" height="56" rx="10" fill="#fff7e6" stroke="#c77d00" stroke-dasharray="7 5"/>
    <text x="452" y="360" class="m">LANES (workqueue)</text>
    <text x="452" y="380" class="m">lanes.&lt;prov&gt;.&lt;host&gt;.&lt;job&gt;</text>
    <rect x="712" y="338" width="250" height="56" rx="10" fill="#fff7e6" stroke="#c77d00" stroke-dasharray="7 5"/>
    <text x="724" y="360" class="m">KV LANE_LEASES (TTL 900s)</text>
    <text x="724" y="380" class="m">key = repo + PR</text>
    <rect x="440" y="404" width="250" height="56" rx="10" fill="#fff7e6" stroke="#c77d00" stroke-dasharray="7 5"/>
    <text x="452" y="426" class="m">LANES_DLQ (7d)</text>
    <text x="452" y="446" class="m">lanes_dlq.&lt;prov&gt;.&lt;host&gt;</text>
    <rect x="712" y="404" width="250" height="56" rx="10" fill="#fff7e6" stroke="#c77d00" stroke-dasharray="7 5"/>
    <text x="724" y="426" class="m">LeaseService</text>
    <text x="724" y="446" class="m">lanesvc.lease.&lt;host&gt;.&lt;op&gt;</text>
  </g>
  <rect x="440" y="474" width="522" height="80" rx="10" fill="#f3f5f8" stroke="#7a8fa6"/>
  <text x="452" y="496" class="s" font-weight="700">Hub-side helpers</text>
  <text x="452" y="518" class="s">DeadLetterWatcher (MAX_DELIVERIES → LANES_DLQ) · submit.py</text>
  <text x="452" y="540" class="s">live aggregator :8787 (SSE) · NucBox worker</text>

  <!-- Workers -->
  <rect x="40" y="150" width="320" height="120" rx="16" fill="#ffffff" stroke="#33475b" stroke-width="2"/>
  <text x="58" y="180" class="t">Mac mini worker</text>
  <text x="58" y="204" class="s">worker.py · classes test,build</text>
  <text x="58" y="226" class="s">guards: load &lt; 10 · swap &lt; 80%</text>
  <text x="58" y="248" class="s">disk ≥ 15 GB</text>

  <rect x="40" y="300" width="320" height="110" rx="16" fill="#ffffff" stroke="#33475b" stroke-width="2"/>
  <text x="58" y="330" class="t">NucBox worker</text>
  <text x="58" y="354" class="s">same worker.py, on the hub box</text>
  <text x="58" y="376" class="s">guards: load &lt; 12 · 4–5 lanes</text>

  <rect x="40" y="440" width="320" height="96" rx="16" fill="#ffffff" stroke="#33475b" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="58" y="470" class="t">MacBook Pro worker</text>
  <text x="58" y="494" class="s">Planned: joins later, same worker</text>
  <text x="58" y="516" class="s">has its own NATS user already</text>

  <g stroke="#1f9d8b" stroke-width="2.5" fill="none">
    <path d="M360 200 C 400 200, 400 300, 440 300" marker-end="url(#g)"/>
    <path d="M360 355 C 400 355, 400 310, 440 305" marker-end="url(#g)"/>
    <path d="M360 488 C 400 488, 400 320, 440 312" marker-end="url(#g)" stroke-dasharray="8 6"/>
  </g>
  <text x="372" y="140" class="lbl">pull jobs · ack own</text>

  <!-- Friends -->
  <rect x="1030" y="140" width="330" height="200" rx="16" fill="#fffaf0" stroke="#c77d00" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="1048" y="170" class="t">Friend's machine (Planned)</text>
  <text x="1048" y="196" class="s">Tailscale share · ACL: tcp:4222 only</text>
  <text x="1048" y="220" class="s">worker + local donor caps</text>
  <rect x="1048" y="234" width="294" height="44" rx="10" fill="#ffffff" stroke="#c77d00"/>
  <text x="1060" y="254" class="s">podman sandbox</text>
  <text x="1060" y="271" class="s">no keys · no-key jobs only</text>
  <text x="1048" y="304" class="s">Credentials never leave this box;</text>
  <text x="1048" y="324" class="s">queue sees remaining headroom only</text>
  <path d="M1030 240 C 1000 240, 1000 230, 964 230" stroke="#c77d00" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#o)"/>

  <!-- AI lanes -->
  <rect x="1030" y="370" width="330" height="200" rx="16" fill="#ffffff" stroke="#33475b" stroke-width="2"/>
  <text x="1048" y="400" class="t">AI lanes (pooled capacity)</text>
  <text x="1048" y="426" class="s">Codex · $200 · low effort default</text>
  <text x="1048" y="450" class="s">Cursor · $200 · composer</text>
  <text x="1048" y="474" class="s">Claude · $20 · key reviews + Karen</text>
  <text x="1048" y="498" class="s">MiniMax BYOK · cheap lanes</text>
  <text x="1048" y="522" class="s">Gemini API prepaid · reviews</text>
  <text x="1048" y="548" class="lbl">Prepaid only. Lanes queue: stage 1 library.</text>
  <path d="M1030 430 C 1000 430, 1000 366, 964 366" stroke="#c77d00" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#o)"/>

  <!-- Metrics path -->
  <rect x="420" y="640" width="560" height="120" rx="16" fill="#0d1b2a"/>
  <text x="440" y="672" font-size="20" font-weight="700" fill="#ffffff">bob-ops-dashboard · live speedometers</text>
  <text x="440" y="698" font-size="15" fill="#b9c7d6">metrics.&lt;node&gt; on NATS → dashboard user (subscribe-only)</text>
  <text x="440" y="720" font-size="15" fill="#b9c7d6">node/v1 POST /api/node → aggregator → SSE → browser</text>
  <text x="440" y="742" font-size="15" fill="#ffd166">Planned: donor donated-vs-used share</text>
  <path d="M700 570 L700 636" stroke="#33475b" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M200 536 C 200 700, 300 700, 416 700" stroke="#33475b" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="210" y="610" class="lbl">metrics.&lt;node&gt; every few s</text>

  <!-- Governance -->
  <rect x="1030" y="640" width="330" height="120" rx="16" fill="#ffffff" stroke="#7a3fa8" stroke-width="2"/>
  <text x="1048" y="672" class="t">Governance</text>
  <text x="1048" y="698" class="s">Karen gates every merge</text>
  <text x="1048" y="722" class="s">No force-push · CI cluster-tests</text>
  <text x="1048" y="746" class="s">Spending: prepaid only</text>

  <!-- Legend -->
  <rect x="40" y="800" width="1320" height="96" rx="14" fill="#ffffff" stroke="#d5dde6"/>
  <text x="60" y="830" class="t">Legend</text>
  <line x1="60" y1="860" x2="120" y2="860" stroke="#1f9d8b" stroke-width="3" marker-end="url(#g)"/>
  <text x="130" y="865" class="s">job pulls (built, JOBS stream)</text>
  <line x1="390" y1="860" x2="450" y2="860" stroke="#c77d00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#o)"/>
  <text x="460" y="865" class="s">planned / in-progress path</text>
  <line x1="700" y1="860" x2="760" y2="860" stroke="#33475b" stroke-width="3" marker-end="url(#a)"/>
  <text x="770" y="865" class="s">metrics</text>
  <rect x="880" y="846" width="40" height="28" rx="6" fill="#fff7e6" stroke="#c77d00" stroke-dasharray="6 4"/>
  <text x="930" y="865" class="s">merged code, not yet live on the hub</text>
</svg>
