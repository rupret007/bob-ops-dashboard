name: Cluster tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python dependencies
        run: pip install -r cluster/requirements.txt
      - name: Install nats-server
        run: |
          set -euo pipefail
          NAT_DIR="${RUNNER_TEMP}/nats-bin"
          mkdir -p "${NAT_DIR}"
          bash cluster/install-nats.sh --ci "${NAT_DIR}"
          echo "${NAT_DIR}" >> "${GITHUB_PATH}"
      - name: Run strict guard unit tests
        env:
          PYTHONPATH: .
          BOB_REQUIRE_NATS: "1"
        run: python3 -m unittest -v cluster.tests.test_strict_guard
      - name: Run cluster unit tests
        env:
          PYTHONPATH: .
          BOB_REQUIRE_NATS: "1"
        run: python3 -m cluster.tests.run_strict

  python39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r cluster/requirements.txt pytest
      - run: python -m compileall -q cluster
      - run: python -m pytest cluster/tests/test_python39.py cluster/tests/test_python39_runtime.py cluster/tests/test_live_metrics.py cluster/tests/test_self_update.py cluster/tests/test_never_touch.py cluster/tests/test_install_scripts.py cluster/control_plane/local_karen/tests cluster/control_plane/dashboard/tests -q
