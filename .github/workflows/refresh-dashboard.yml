name: Refresh Bob Ops Dashboard

# Near-realtime data: rebuild index.html + status.json from live gh every 15 minutes.
# Client also polls status.json every 30s (pauses when tab hidden) and reloads when generated_at changes.
# Theme source of truth: refresh.sh (Claude orange #d97757 on black -- never blue).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: bob-ops-dashboard-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup gh auth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          gh auth status || true

      - name: Rebuild dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: rupret007
        run: |
          set -euo pipefail
          chmod +x ./refresh.sh
          # Snapshot verify so a mid-TTL rebuild cannot silently wipe Unlock.
          cp status.json /tmp/status.before.json
          ./refresh.sh
          python3 - <<'PY'
          import json, time
          from preserve_verify import apply_preserved_verify
          before = json.loads(open("/tmp/status.before.json", encoding="utf-8").read())
          after = json.loads(open("status.json", encoding="utf-8").read())
          now = int(time.time() * 1000)
          expect = {}
          kept = apply_preserved_verify(expect, before, now_ms=now, log=print)
          if kept is None:
              print("no live allowlisted verify before refresh")
          else:
              got = (after.get("verify") or {}) if isinstance(after, dict) else {}
              if (got.get("sha256") or "").lower() != kept["sha256"]:
                  raise SystemExit("refresh wiped a still-in-window verify (Unlock race)")
              print("verify survived refresh")
          PY

      - name: QA claim smoke (generated page)
        run: |
          set -euo pipefail
          chmod +x ./qa-claim-smoke.sh
          ./qa-claim-smoke.sh

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "bob-ops-dashboard[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html status.json
          if git diff --cached --quiet; then
            echo "No dashboard changes."
            exit 0
          fi
          git commit -m "chore: refresh ops dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main
