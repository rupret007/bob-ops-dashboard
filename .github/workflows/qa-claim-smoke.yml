name: QA claim smoke

# Public snapshot contract, shared-renderer behavior, and offline refresh integrity.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate checked-in public artifacts
        run: python3 qa-generated.py
      - name: Validate synthetic integration with existing runner tools
        run: |
          set -euo pipefail
          python3 qa-offline.py
          test -z "$(git status --porcelain)"
      - name: Record tested checkout
        run: |
          {
            echo 'Synthetic integration passed; no live portfolio or publication verification.'
            echo "Commit: $(git rev-parse HEAD)"
            echo "Tree: $(git rev-parse HEAD^{tree})"
            echo "Parents: $(git show -s --format=%P HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
