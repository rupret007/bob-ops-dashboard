name: QA claim smoke

# Fail-closed static gate: node --check, ASCII-safe JS, no OTP leftovers, XSS helpers.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate and validate disposable dashboard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: rupret007
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp README.md board_meta.py index.html refresh.sh status.json "$scratch/"
          chmod +x "$scratch/refresh.sh" ./qa-claim-smoke.sh
          (
            cd "$scratch"
            ./refresh.sh
          )
          REFRESH_SH="$scratch/refresh.sh" \
            STATUS_JSON="$scratch/status.json" \
            ./qa-claim-smoke.sh "$scratch/index.html"
          test -z "$(git status --porcelain)"
