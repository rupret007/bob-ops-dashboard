name: QA claim smoke

# Fail-closed static gate: node --check, ASCII-safe JS, no OTP leftovers, XSS helpers.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce source-only feature PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "$BASE_SHA"...HEAD -- index.html status.json; then
            echo "Feature PRs must not change scheduler-owned index.html or status.json." >&2
            exit 1
          fi
      - name: Validate synthetic integration with existing runner tools
        run: |
          set -euo pipefail
          python3 qa-offline.py
          test -z "$(git status --porcelain)"
      - name: Record tested checkout
        run: |
          {
            echo 'Synthetic integration passed; no live portfolio or publication verification.'
            echo "Commit: $(git rev-parse HEAD)"
            echo "Tree: $(git rev-parse HEAD^{tree})"
            echo "Parents: $(git show -s --format=%P HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
